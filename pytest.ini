[pytest]
# The source modules import siblings by bare name after a runtime sys.path.insert
# (e.g. `import rule_classifier`). Put those dirs on the path so tests can import
# the modules directly. Keep in sync with the sys.path.insert() calls in src/ and
# the extraPaths in .vscode/settings.json.
pythonpath = src/classify src/evaluate src/ingest
testpaths = tests
